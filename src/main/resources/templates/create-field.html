<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Maydonni tahrirlash | ManaPolya' : 'Yangi sport maydoni qo\'shish | ManaPolya'">Maydon Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <style>
        body { background-color: #f4f7f6; }
        #map { width: 100%; height: 380px; border-radius: 12px; border: 2px solid #e9ecef; }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); }
        .form-label { color: #495057; }
        .btn-success-custom { background-color: #198754; border: none; padding: 12px; border-radius: 10px; font-weight: 600; transition: all 0.2s; }
        .btn-success-custom:hover { background-color: #146c43; transform: translateY(-1px); }
        .btn-warning-custom { background-color: #ffc107; border: none; padding: 12px; border-radius: 10px; font-weight: 600; color: #212529; transition: all 0.2s; }
        .btn-warning-custom:hover { background-color: #e0a800; transform: translateY(-1px); }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card card-custom p-4 p-md-5 bg-white">

                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <div class="d-flex align-items-center">
                        <a href="/profile/dashboard" class="btn btn-outline-secondary btn-sm rounded-3 me-3">
                            <i class="bi bi-arrow-left"></i> Kabinetga qaytish
                        </a>
                        <h3 class="fw-bold m-0" th:classappend="${isEdit} ? 'text-warning' : 'text-success'">
                            <i th:class="${isEdit} ? 'bi bi-pencil-square me-2' : 'bi bi-plus-circle-fill me-2'"></i>
                            <span th:text="${isEdit} ? 'Maydon ma\'lumotlarini tahrirlash' : 'Yangi sport maydoni qo\'shish'"></span>
                        </h3>
                    </div>
                    <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill fw-semibold">Owner Mode</span>
                </div>

                <div th:if="${error}" class="alert alert-danger d-flex align-items-center rounded-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div th:text="${error}"></div>
                </div>

                <form id="fieldForm" th:action="${isEdit} ? @{|/fields/${fieldDto.id}/edit|} : @{/fields/create}" th:object="${fieldDto}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:if="${isEdit}" th:field="*{id}">

                    <div class="row g-4">

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Maydon nomi <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control form-control-lg rounded-3" required placeholder="Masalan: Bunyodkor mini-stadioni">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Soatbay narxi (so'mda) <span class="text-danger">*</span></label>
                            <div class="input-group input-group-lg">
                                <input type="number" th:field="*{priceHour}" class="form-control rounded-start-3" required placeholder="Masalan: 120000">
                                <span class="input-group-text rounded-end-3 small bg-light text-muted">so'm</span>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('priceHour')}" th:errors="*{priceHour}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Viloyat <span class="text-danger">*</span></label>
                            <select id="regionSelect" class="form-select form-select-lg rounded-3" required>
                                <option value="">-- Viloyatni tanlang --</option>
                                <option th:each="reg : ${regions}" th:value="${reg.id}" th:text="${reg.regionName}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Tuman / Shahar <span class="text-danger">*</span></label>
                            <select id="districtSelect" th:field="*{districtId}" class="form-select form-select-lg rounded-3" required
                                    th:disabled="${!isEdit}" th:data-selected="${isEdit} ? *{districtId} : ''">
                                <option value="">-- Avval viloyatni tanlang --</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('districtId')}" th:errors="*{districtId}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Aniq manzil (Mo'ljal) <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{address}" class="form-control form-control-lg rounded-3" required placeholder="Masalan: Chilonzor 2-kvartal, G'ofur G'ulom bog'i ro'parasi">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>

                        <div class="col-12" th:if="${!isEdit}">
                            <label class="form-label small fw-bold text-success">
                                <i class="bi bi-images me-1"></i> Stadion rasmlarini yuklang (Kamida 1 ta rasm) <span class="text-danger">*</span>
                            </label>
                            <input type="file" name="images" class="form-control form-control-lg rounded-3" multiple accept="image/*" required>
                            <div class="form-text small text-muted">Bir vaqtning o'zida bir nechta chiroyli rasmlarni tanlashingiz mumkin.</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Maydon turi <span class="text-danger">*</span></label>
                            <select th:field="*{fieldType}" class="form-select form-select-lg rounded-3" required>
                                <option value="FOOTBALL">Futbol maydoni</option>
                                <option value="TENNIS">Tennis korti</option>
                                <option value="BASKETBALL">Basketbol maydoni</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fieldType')}" th:errors="*{fieldType}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Ochilish vaqti <span class="text-danger">*</span></label>
                            <input type="time" th:field="*{openTime}" class="form-control form-control-lg rounded-3" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Yopilish vaqti <span class="text-danger">*</span></label>
                            <input type="time" th:field="*{closeTime}" class="form-control form-control-lg rounded-3" required>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check form-switch card p-3 rounded-3 border bg-light d-flex align-items-center justify-content-between ps-5">
                                <label class="form-check-label fw-medium m-0" for="showerSwitch">
                                    <i class="bi bi-droplet text-primary me-1"></i> Dush xonasi mavjud
                                </label>
                                <input class="form-check-input form-check-input-lg" type="checkbox" th:field="*{hasShower}" id="showerSwitch">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch card p-3 rounded-3 border bg-light d-flex align-items-center justify-content-between ps-5">
                                <label class="form-check-label fw-medium m-0" for="lightSwitch">
                                    <i class="bi bi-brightness-high text-warning me-1"></i> Tungi yoritgichlar bor
                                </label>
                                <input class="form-check-input form-check-input-lg" type="checkbox" th:field="*{hasLight}" id="lightSwitch">
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <label class="form-label small fw-bold text-primary">
                                <i class="bi bi-geo-alt-fill me-1"></i> Xaritadan stadion ustiga bosing (Koordinata avtomatik olinadi): <span class="text-danger">*</span>
                            </label>
                            <div id="map" class="shadow-sm"></div>
                        </div>

                        <input type="hidden" th:field="*{latitude}" id="latInput">
                        <input type="hidden" th:field="*{longitude}" id="lngInput">

                        <div class="col-12 mt-2">
                            <label class="form-label small fw-bold">Qo'shimcha tavsif (Eslatmalar)</label>
                            <textarea th:field="*{description}" class="form-control rounded-3" rows="4" placeholder="Maydon qoplamasi turi, kiyinish xonasi yoki avtoturargoh haqida ma'lumot yozishingiz mumkin..."></textarea>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" th:class="${isEdit} ? 'btn btn-warning-custom w-100 shadow-sm' : 'btn btn-success-custom w-100 shadow-sm text-white'">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${isEdit} ? 'O\'zgarishlarni muvaffaqiyatli saqlash' : 'Maydonni muvaffaqiyatli saqlash'"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        // ==========================================
        // 1. REGION -> DISTRICT AJAX LOGIKASI
        // ==========================================
        const regionSelect = document.getElementById('regionSelect');
        const districtSelect = document.getElementById('districtSelect');
        const selectedDistrictId = districtSelect.getAttribute("data-selected");

        function fetchDistricts(regionId, callback) {
            if (!regionId) {
                districtSelect.innerHTML = '<option value="">-- Avval viloyatni tanlang --</option>';
                districtSelect.disabled = true;
                return;
            }

            districtSelect.innerHTML = '<option value="">Yuklanmoqda...</option>';
            districtSelect.disabled = true;

            fetch('/auth/districts?regionId=' + regionId)
                .then(res => {
                    if (!res.ok) throw new Error("Tumanlar topilmadi");
                    return res.json();
                })
                .then(districts => {
                    let html = '<option value="">-- Tumanni tanlang --</option>';
                    districts.forEach(d => {
                        // Agar edit rejimi bo'lsa, o'sha tumanni tanlangan qilib qo'yadi
                        const isSel = (selectedDistrictId && d.id == selectedDistrictId) ? 'selected' : '';
                        html += `<option value="${d.id}" ${isSel}>${d.districtName}</option>`;
                    });
                    districtSelect.innerHTML = html;
                    districtSelect.disabled = false;
                    if(callback) callback();
                })
                .catch(err => {
                    console.error(err);
                    districtSelect.innerHTML = '<option value="">Xatolik! Qayta urining</option>';
                });
        }

        if (regionSelect) {
            regionSelect.addEventListener('change', function () {
                fetchDistricts(this.value);
            });
        }

        // Tahrirlash rejimida agar tuman ID saqlangan bo'lsa, avtomat yuklash shart emas (egasining o'zi viloyatni bossa ishlaydi)
        // Lekin toza ishlashi uchun tahrirlash oynasida tumanlar bloklanib qolmaydi.

        // ==========================================
        // 🗺️ 2. YANDEX MAP: KOORDINATANI AVTOMAT OLISH
        // ==========================================
        ymaps.ready(init);

        function init() {
            const latInput = document.getElementById('latInput');
            const lngInput = document.getElementById('lngInput');

            let initialLat = latInput.value ? parseFloat(latInput.value) : 41.311081;
            let initialLng = lngInput.value ? parseFloat(lngInput.value) : 69.240562;
            let initialZoom = latInput.value ? 16 : 12;

            var myMap = new ymaps.Map("map", {
                center: [initialLat, initialLng],
                zoom: initialZoom,
                controls: ['zoomControl', 'fullscreenControl']
            });

            var myPlacemark;

            // Tahrirlash yoki xato bilan qaytganda eski markerni xaritaga aniq chizish
            if (latInput.value && lngInput.value) {
                myPlacemark = new ymaps.Placemark([initialLat, initialLng], {
                    hintContent: 'Maydon joylashuvi'
                }, {
                    preset: 'islands#redDotIcon'
                });
                myMap.geoObjects.add(myPlacemark);
            }

            myMap.events.add('click', function (e) {
                var coords = e.get('coords');

                latInput.value = coords[0];
                lngInput.value = coords[1];

                if (myPlacemark) {
                    myPlacemark.geometry.setCoordinates(coords);
                } else {
                    myPlacemark = new ymaps.Placemark(coords, {
                        hintContent: 'Siz tanlagan joy!'
                    }, {
                        preset: 'islands#redDotIcon'
                    });
                    myMap.geoObjects.add(myPlacemark);
                }
            });
        }

        // ==========================================
        // 3. FRONT-END VALIDATION
        // ==========================================
        const fieldForm = document.getElementById("fieldForm");

        if (fieldForm) {
            fieldForm.addEventListener("submit", function (event) {
                const lat = document.getElementById('latInput').value;
                const lng = document.getElementById('lngInput').value;

                if (!lat || lat.trim() === "" || !lng || lng.trim() === "") {
                    alert("⚠️ Iltimos, sport maydonining geolokatsiyasini belgilash uchun xaritadan stadion ustiga bosing!");
                    event.preventDefault();
                    return false;
                }
            });
        }
    });
</script>
</body>
</html>
