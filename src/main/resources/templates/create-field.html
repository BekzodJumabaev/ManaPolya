<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yangi maydon qo'shish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <style>
        #map { width: 100%; height: 350px; border-radius: 8px; border: 1px solid #ced4da; }
    </style>
</head>
<body class="bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">

                <div class="d-flex align-items-center mb-4">
                    <a href="/" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i> Orqaga</a>
                    <h3 class="fw-bold m-0 text-success"><i class="bi bi-plus-circle-fill me-2"></i>Yangi maydon qo'shish</h3>
                </div>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/fields/create}" th:object="${fieldDto}" method="post" enctype="multipart/form-data">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Maydon nomi</label>
                            <input type="text" th:field="*{name}" class="form-control" required placeholder="Masalan: Bunyodkor mini-stadioni">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Soatbay narxi (so'mda)</label>
                            <input type="number" th:field="*{priceHour}" class="form-control" required placeholder="Masalan: 120000">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Viloyat</label>
                            <select id="regionSelect" class="form-select" required>
                                <option value="">-- Viloyatni tanlang --</option>
                                <option th:each="reg : ${regions}" th:value="${reg.id}" th:text="${reg.regionName}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Tuman / Shahar</label>
                            <select id="districtSelect" th:field="*{districtId}" class="form-select" required disabled>
                                <option value="">-- Avval viloyatni tanlang --</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Aniq manzil (Mo'ljal)</label>
                            <input type="text" th:field="*{address}" class="form-control" required placeholder="Masalan: Chilonzor 2-kvartal, 15-uy">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-success"><i class="bi bi-images me-1"></i> Stadion rasmlarini yuklang</label>
                            <input type="file" name="images" class="form-control" multiple accept="image/*" required>
                            <div class="form-text small text-muted">Bir nechta rasm tanlashingiz mumkin.</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Maydon turi</label>
                            <select th:field="*{fieldType}" class="form-select" required>
                                <option value="FOOTBALL">Futbol maydoni</option>
                                <option value="TENNIS">Tennis korti</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Ochilish vaqti</label>
                            <input type="time" th:field="*{openTime}" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Yopilish vaqti</label>
                            <input type="time" th:field="*{closeTime}" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" th:field="*{hasShower}" id="showerSwitch">
                                <label class="form-check-label fw-medium" for="showerSwitch">Dush xonasi bor</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" th:field="*{hasLight}" id="lightSwitch">
                                <label class="form-check-label fw-medium" for="lightSwitch">Tungi yoritgichlar bor</label>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <label class="form-label small fw-bold text-primary"><i class="bi bi-geo-alt-fill me-1"></i> Xaritadan stadion ustiga bosing (Koordinata avtomat olinadi):</label>
                            <div id="map"></div>
                        </div>

                        <input type="hidden" th:field="*{latitude}" id="latInput">
                        <input type="hidden" th:field="*{longitude}" id="lngInput">

                        <div class="col-12 mt-3">
                            <label class="form-label small fw-bold">Qo'shimcha tavsif</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Maydon haqida eslatmalar..."></textarea>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow"><i class="bi bi-check-lg me-1"></i> Maydonni saqlash</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // 1. REGION -> DISTRICT AJAX LOGIKASI
    document.getElementById('regionSelect').addEventListener('change', function () {
        const regionId = this.value;
        const districtSelect = document.getElementById('districtSelect');
        if (!regionId) {
            districtSelect.innerHTML = '<option value="">-- Avval viloyatni tanlang --</option>';
            districtSelect.disabled = true;
            return;
        }
        fetch('/auth/districts?regionId=' + regionId)
            .then(res => res.json())
            .then(districts => {
                let html = '<option value="">-- Tumanni tanlang --</option>';
                districts.forEach(d => { html += `<option value="${d.id}">${d.districtName}</option>`; });
                districtSelect.innerHTML = html;
                districtSelect.disabled = false;
            });
    });

    // 🗺️ 2. YANDEX MAP: BOSILGANDA KOORDINATANI AVTOMAT OLISH LOGIKASI
    ymaps.ready(init);
    function init() {
        // Default Toshkent markazida xaritani ochish
        var myMap = new ymaps.Map("map", {
            center: [41.311081, 69.240562],
            zoom: 12,
            controls: ['zoomControl', 'fullscreenControl']
        });

        var myPlacemark;

        // Xarita ustiga bosilganda (Click event)
        myMap.events.add('click', function (e) {
            var coords = e.get('coords'); // Bosilgan joy koordinatasi [latitude, longitude]

            // Yashirin inputlarga yozish
            document.getElementById('latInput').value = coords[0];
            document.getElementById('lngInput').value = coords[1];

            // Eski nuqtani o'chirib, yangi qizil marker qo'yish
            if (myPlacemark) {
                myPlacemark.geometry.setCoordinates(coords);
            } else {
                myPlacemark = new ymaps.Placemark(coords, {
                    hintContent: 'Siz tanlagan joy!'
                }, {
                    preset: 'islands#redDotIcon'
                });
                myMap.geoObjects.add(myPlacemark);
            }
        });
    }
</script>
</body>
</html>
