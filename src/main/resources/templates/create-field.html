<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments :: header_links}"></div>
    <title th:text="${isEdit} ? 'Maydonni tahrirlash | ManaPolya' : 'Yangi sport maydoni qo\'shish | ManaPolya'">Maydon Paneli</title>

    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>

    <style>
        #map { width: 100%; height: 400px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .card-form-premium { border-radius: 24px; border: none; box-shadow: 0 15px 40px rgba(15, 23, 42, 0.04); }
        .premium-label { font-weight: 600; color: #475569; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
        .premium-input-field { border-radius: 12px !important; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; font-weight: 500; color: #1e293b; transition: all 0.2s ease; }
        .premium-input-field:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.12); }
        .switch-card-premium { border-radius: 16px; border: 1px solid #e2e8f0; padding: 1.25rem; transition: all 0.25s ease; }
        .switch-card-premium:hover { border-color: #cbd5e1; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<div class="container my-5 pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 animate__animated animate__fadeInUp">
            <div class="card card-form-premium p-4 p-md-5 bg-white">

                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <div class="d-flex align-items-center">
                        <a href="/profile/dashboard" class="btn btn-outline-secondary btn-sm btn-premium-action btn-login-custom me-3">
                            <i class="bi bi-arrow-left"></i> Kabinetga
                        </a>
                        <h3 class="fw-black m-0" th:classappend="${isEdit} ? 'text-warning' : 'text-success'" style="letter-spacing: -0.5px;">
                            <i th:class="${isEdit} ? 'bi bi-pencil-square me-2' : 'bi bi-plus-circle-fill me-2'"></i>
                            <span th:text="${isEdit} ? 'Maydon ma\'lumotlarini tahrirlash' : 'Yangi sport maydoni qo\'shish'"></span>
                        </h3>
                    </div>
                    <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill fw-bold border border-success border-opacity-10">Owner Mode</span>
                </div>

                <div th:if="${error}" class="alert alert-danger d-flex align-items-center rounded-3 border-0 border-start border-danger border-4 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 text-danger"></i>
                    <div class="fw-medium text-danger" th:text="${error}"></div>
                </div>

                <form id="fieldForm" th:action="${isEdit} ? @{|/fields/${fieldDto.id}/edit|} : @{/fields/create}" th:object="${fieldDto}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:if="${isEdit}" th:field="*{id}">

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label premium-label">Maydon nomi <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control premium-input-field" required placeholder="Masalan: Bunyodkor mini-stadioni">
                            <div class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label premium-label">Soatbay narxi (so'mda) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" th:field="*{priceHour}" class="form-control premium-input-field border-end-0" style="border-radius: 12px 0 0 12px !important;" required placeholder="Masalan: 120000">
                                <span class="input-group-text bg-light text-muted fw-semibold px-3" style="border-radius: 0 12px 12px 0 !important; border: 1px solid #cbd5e1; border-start-0; border-bottom-0;">so'm</span>
                            </div>
                            <div class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('priceHour')}" th:errors="*{priceHour}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label premium-label">Viloyat <span class="text-danger">*</span></label>
                            <select id="regionSelect" class="form-select premium-input-field" required>
                                <option value="">-- Viloyatni tanlang --</option>
                                <option th:each="reg : ${regions}" th:value="${reg.id}" th:text="${reg.regionName}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label premium-label">Tuman / Shahar <span class="text-danger">*</span></label>
                            <select id="districtSelect" th:field="*{districtId}" class="form-select premium-input-field" required
                                    th:disabled="${!isEdit}" th:data-selected="${isEdit} ? *{districtId} : ''">
                                <option value="">-- Avval viloyatni tanlang --</option>
                            </select>
                            <div class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('districtId')}" th:errors="*{districtId}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label premium-label">Aniq manzil (Mo'ljal) <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{address}" class="form-control premium-input-field" required placeholder="Masalan: Chilonzor 2-kvartal, G'ofur G'ulom bog'i ro'parasi">
                            <div class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>

                        <div class="col-12" th:if="${!isEdit}">
                            <label class="form-label premium-label text-success"><i class="bi bi-images me-1"></i> Stadion rasmlarini yuklang (Kamida 1 ta) <span class="text-danger">*</span></label>
                            <input type="file" name="images" class="form-control premium-input-field bg-light border-dashed" multiple accept="image/*" required>
                            <div class="form-text small text-muted mt-1">Bir vaqtning o'zida bir nechta sifatli rasmlarni tanlashingiz mumkin.</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label premium-label">Maydon turi <span class="text-danger">*</span></label>
                            <select th:field="*{fieldType}" class="form-select premium-input-field" required>
                                <option value="FOOTBALL">Futbol maydoni</option>
                                <option value="TENNIS">Tennis korti</option>
                                <option value="BASKETBALL">Basketbol maydoni</option>
                            </select>
                            <div class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('fieldType')}" th:errors="*{fieldType}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label premium-label">Ochilish vaqti <span class="text-danger">*</span></label>
                            <input type="time" th:field="*{openTime}" class="form-control premium-input-field" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label premium-label">Yopilish vaqti <span class="text-danger">*</span></label>
                            <input type="time" th:field="*{closeTime}" class="form-control premium-input-field" required>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch card switch-card-premium d-flex flex-row align-items-center justify-content-between ps-5">
                                <label class="form-check-label fw-bold small text-secondary m-0" for="showerSwitch">
                                    <i class="bi bi-droplet-fill text-primary fs-5 me-1"></i> Dush xonasi mavjud
                                </label>
                                <input class="form-check-input form-check-input-lg" style="cursor: pointer;" type="checkbox" th:field="*{hasShower}" id="showerSwitch">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check form-switch card switch-card-premium d-flex flex-row align-items-center justify-content-between ps-5">
                                <label class="form-check-label fw-bold small text-secondary m-0" for="lightSwitch">
                                    <i class="bi bi-brightness-high-fill text-warning fs-5 me-1"></i> Tungi yoritgichlar bor
                                </label>
                                <input class="form-check-input form-check-input-lg" style="cursor: pointer;" type="checkbox" th:field="*{hasLight}" id="lightSwitch">
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <label class="form-label premium-label text-primary">
                                <i class="bi bi-geo-alt-fill me-1 fs-5"></i> Xaritadan stadion aniq joyini belgilang (Koordinata avtomatik olinadi): <span class="text-danger">*</span>
                            </label>
                            <div id="map" class="shadow-sm"></div>
                        </div>

                        <input type="hidden" th:field="*{latitude}" id="latInput">
                        <input type="hidden" th:field="*{longitude}" id="lngInput">

                        <div class="col-12 mt-2">
                            <label class="form-label premium-label">Qo'shimcha tavsif (Eslatmalar)</label>
                            <textarea th:field="*{description}" class="form-control premium-input-field" rows="4" placeholder="Maydon qoplamasi turi, kiyinish xonasi, avtoturargoh yoki boshqa sharoitlar haqida batafsil yozishingiz mumkin..."></textarea>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" th:class="${isEdit} ? 'btn btn-warning-custom btn-premium-action btn-register-custom w-100 py-3 text-dark' : 'btn btn-success-custom btn-premium-action btn-register-custom w-100 py-3 text-white'">
                                <i class="bi bi-cloud-arrow-up-fill me-1"></i>
                                <span th:text="${isEdit} ? 'O\'zgarishlarni muvaffaqiyatli saqlash' : 'Maydonni muvaffaqiyatli e\'lon qilish'"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer_scripts}"></div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        const regionSelect = document.getElementById('regionSelect');
        const districtSelect = document.getElementById('districtSelect');
        const selectedDistrictId = districtSelect.getAttribute("data-selected");

        function fetchDistricts(regionId, callback) {
            if (!regionId) {
                districtSelect.innerHTML = '<option value="">-- Avval viloyatni tanlang --</option>';
                districtSelect.disabled = true;
                return;
            }

            districtSelect.innerHTML = '<option value="">Yuklanmoqda...</option>';
            districtSelect.disabled = true;

            fetch('/auth/districts?regionId=' + regionId)
                .then(res => {
                    if (!res.ok) throw new Error("Tumanlar topilmadi");
                    return res.json();
                })
                .then(districts => {
                    let html = '<option value="">-- Tumanni tanlang --</option>';
                    districts.forEach(d => {
                        const isSel = (selectedDistrictId && d.id == selectedDistrictId) ? 'selected' : '';
                        html += `<option value="${d.id}" ${isSel}>${d.districtName}</option>`;
                    });
                    districtSelect.innerHTML = html;
                    districtSelect.disabled = false;
                    if(callback) callback();
                })
                .catch(err => {
                    console.error(err);
                    districtSelect.innerHTML = '<option value="">Xatolik! Qayta urining</option>';
                });
        }

        if (regionSelect) {
            regionSelect.addEventListener('change', function () {
                fetchDistricts(this.value);
            });
        }

        // Tahrirlash rejimida agar eski viloyat tanlangan bo'lsa, tumanlarni srazu yuklash
        if (regionSelect && regionSelect.value) {
            fetchDistricts(regionSelect.value);
        }

        ymaps.ready(init);

        function init() {
            const latInput = document.getElementById('latInput');
            const lngInput = document.getElementById('lngInput');

            let initialLat = latInput.value ? parseFloat(latInput.value) : 41.311081;
            let initialLng = lngInput.value ? parseFloat(lngInput.value) : 69.240562;
            let initialZoom = latInput.value ? 16 : 12;

            var myMap = new ymaps.Map("map", {
                center: [initialLat, initialLng],
                zoom: initialZoom,
                controls: ['zoomControl', 'fullscreenControl']
            });

            var myPlacemark;

            if (latInput.value && lngInput.value) {
                myPlacemark = new ymaps.Placemark([initialLat, initialLng], {
                    hintContent: 'Maydon joylashuvi'
                }, {
                    preset: 'islands#redDotIcon'
                });
                myMap.geoObjects.add(myPlacemark);
            }

            myMap.events.add('click', function (e) {
                var coords = e.get('coords');

                latInput.value = coords[0];
                lngInput.value = coords[1];

                if (myPlacemark) {
                    myPlacemark.geometry.setCoordinates(coords);
                } else {
                    myPlacemark = new ymaps.Placemark(coords, {
                        hintContent: 'Siz tanlagan joy!'
                    }, {
                        preset: 'islands#redDotIcon'
                    });
                    myMap.geoObjects.add(myPlacemark);
                }
            });
        }

        const fieldForm = document.getElementById("fieldForm");

        if (fieldForm) {
            fieldForm.addEventListener("submit", function (event) {
                const lat = document.getElementById('latInput').value;
                const lng = document.getElementById('lngInput').value;

                if (!lat || lat.trim() === "" || !lng || lng.trim() === "") {
                    alert("⚠️ Iltimos, sport maydonining geolokatsiyasini belgilash uchun xaritadan stadion ustiga bosing!");
                    event.preventDefault();
                    return false;
                }
            });
        }
    });
</script>
</body>
</html>
