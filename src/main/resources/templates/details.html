<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="|${field.name} - Batafsil|">Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>.details-img { height: 400px; object-fit: cover; border-radius: 15px; }</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success shadow-sm mb-4">
    <div class="container"><a class="navbar-brand fw-bold" href="/"><i class="bi bi-arrow-left me-2"></i>Orqaga</a></div>
</nav>

<div class="container pb-5">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <img th:if="${not #lists.isEmpty(field.images)}" th:src="${field.images[0].url}" class="w-100 details-img shadow mb-4">
            <img th:if="${#lists.isEmpty(field.images)}" src="https://via.placeholder.com/800x450?text=No+Image" class="w-100 details-img shadow mb-4">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="fw-bold" th:text="${field.name}">Nomi</h2>
                <p class="text-muted" th:text="${field.description}">Tavsif...</p>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="fw-bold text-success mb-4 text-center">Hozir bron qiling</h4>
                <p class="h4 text-center fw-bold mb-4" th:text="|${field.priceHour} so'm/soat|"></p>

                <form th:action="@{|/fields/${field.id}/book|}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Boshlanish vaqti</label>
                        <input type="datetime-local" name="startTime" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Tugash vaqti</label>
                        <input type="datetime-local" name="endTime" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Tasdiqlash</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
