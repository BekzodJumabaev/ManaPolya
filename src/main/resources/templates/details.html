<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|${field.name} - Batafsil|">Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .details-img { height: 400px; object-fit: cover; border-radius: 15px; }
        .feature-icon { font-size: 1.5rem; color: #198754; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-arrow-left me-2"></i>Orqaga qaytish</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-lg-7">
            <img th:if="${not #lists.isEmpty(field.images)}" th:src="${field.images[0].url}" class="w-100 details-img shadow mb-4" alt="Field">
            <img th:if="${#lists.isEmpty(field.images)}" src="https://via.placeholder.com/800x450?text=Rasm+yo'q" class="w-100 details-img shadow mb-4" alt="No image">

            <div class="card border-0 shadow-sm p-4">
                <h3 class="fw-bold mb-3">Maydon haqida tavsif</h3>
                <p class="text-muted" th:text="${field.description}">Tavsif bu yerda bo'ladi...</p>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-4 h-100">
                <h2 class="fw-bold text-success mb-4" th:text="${field.name}">Maydon nomi</h2>

                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-bottom px-0">
                        <span><i class="bi bi-geo-alt me-2 text-danger"></i>Manzil:</span>
                        <span class="fw-bold" th:text="|${field.regionName}, ${field.districtName}|">Toshkent</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-bottom px-0">
                        <span><i class="bi bi-clock me-2"></i>Ish vaqti:</span>
                        <span class="fw-bold" th:text="|${field.openTime} - ${field.closeTime}|">08:00 - 22:00</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-bottom px-0">
                        <span><i class="bi bi-currency-dollar me-2"></i>Narxi:</span>
                        <span class="fw-bold h4 text-success mb-0" th:text="|${field.priceHour} so'm/soat|">150 000</span>
                    </li>
                </ul>

                <div class="row g-3 mb-4 text-center">
                    <div class="col-6">
                        <div class="p-3 bg-light rounded shadow-sm">
                            <i th:class="${field.hasShower} ? 'bi bi-droplet-fill feature-icon' : 'bi bi-droplet feature-icon text-muted'"></i>
                            <p class="small mb-0 mt-2" th:text="${field.hasShower} ? 'Dush bor' : 'Dush yo\'q'"></p>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 bg-light rounded shadow-sm">
                            <i th:class="${field.hasLight} ? 'bi bi-lightbulb-fill feature-icon' : 'bi bi-lightbulb feature-icon text-muted'"></i>
                            <p class="small mb-0 mt-2" th:text="${field.hasLight} ? 'Chiroq bor' : 'Chiroq yo\'q'"></p>
                        </div>
                    </div>
                </div>

                <button class="btn btn-success btn-lg w-100 shadow-sm py-3 fw-bold">
                    <i class="bi bi-calendar-check me-2"></i>Hozir bron qilish
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
