<!--
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - ManaPolya'">ManaPolya</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        },
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        [x-cloak] { display: none !important; }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

<header th:fragment="header" class="glass-nav sticky top-0 z-50 w-full transition-all duration-300" x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-20 items-center">

            <div class="flex-shrink-0 flex items-center">
                <a th:href="@{/}" class="flex items-center space-x-3 group">
                    <div class="bg-brand-600 p-2.5 rounded-xl shadow-md shadow-green-600/20 group-hover:scale-105 transition-transform duration-200">
                        <i data-lucide="layout-grid" class="w-6 h-6 text-white"></i>
                    </div>
                    <span class="text-2xl font-black bg-gradient-to-r from-brand-600 to-emerald-700 bg-clip-text text-transparent tracking-tight">ManaPolya</span>
                </a>
            </div>

            <nav class="hidden md:flex space-x-8 font-semibold">
                <a th:href="@{/}" class="text-slate-600 hover:text-brand-600 px-1 py-2 text-sm transition-colors flex items-center space-x-2">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span>Maydon Qidirish</span>
                </a>

                <a sec:authorize="hasRole('OWNER')" th:href="@{/profile}" class="text-slate-600 hover:text-brand-600 px-1 py-2 text-sm transition-colors flex items-center space-x-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Maydonlarim</span>
                </a>
            </nav>

            <div class="hidden md:flex items-center space-x-4">
                <div sec:authorize="isAnonymous()" class="flex items-center space-x-3">
                    <a th:href="@{/auth/login}" class="text-slate-600 hover:text-brand-600 px-4 py-2 text-sm font-bold transition-colors">Kirish</a>
                    <a th:href="@{/auth/signup}" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm shadow-green-600/10 hover:shadow-md hover:shadow-green-600/20 transition-all duration-200">Ro'yxatdan o'tish</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="flex items-center space-x-4">
                    <a th:href="@{/profile}" class="flex items-center space-x-3 bg-slate-100 hover:bg-slate-200/80 px-4 py-2 rounded-xl transition-all duration-200">
                        <div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center border border-brand-200">
                            <i data-lucide="user" class="w-4 h-4 text-brand-700"></i>
                        </div>
                        <div class="flex flex-col text-left">
                            <span class="text-sm font-bold text-slate-800" th:text="${currentFullUsername}">Foydalanuvchi</span>
                            <span class="text-[10px] uppercase font-black tracking-wider text-slate-400" sec:authentication="principal.authorities[0].authority.replace('ROLE_', '')">Role</span>
                        </div>
                    </a>

                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="p-2.5 text-slate-400 hover:text-red-500 rounded-xl hover:bg-red-50 transition-colors" title="Chiqish">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="md:hidden flex items-center">
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-slate-600 hover:text-slate-900 p-2 rounded-xl hover:bg-slate-100 transition-colors focus:outline-none">
                    <i data-lucide="menu" x-show="!mobileMenuOpen" class="w-6 h-6"></i>
                    <i data-lucide="x" x-show="mobileMenuOpen" class="w-6 h-6" x-cloak></i>
                </button>
            </div>
        </div>
    </div>

    <div x-show="mobileMenuOpen" x-transition class="md:hidden border-t border-slate-200 bg-white px-4 pt-2 pb-6 space-y-3" x-cloak>
        <a th:href="@{/}" class="block px-3 py-3 rounded-xl text-base font-semibold text-slate-700 hover:bg-slate-50 hover:text-brand-600">Maydon Qidirish</a>
        <a sec:authorize="hasRole('OWNER')" th:href="@{/profile}" class="block px-3 py-3 rounded-xl text-base font-semibold text-slate-700 hover:bg-slate-50 hover:text-brand-600">Maydonlarim</a>

        <div class="pt-4 border-t border-slate-100">
            <div sec:authorize="isAnonymous()" class="space-y-2">
                <a th:href="@{/auth/login}" class="block w-full text-center px-4 py-3 rounded-xl text-base font-bold text-slate-700 bg-slate-50 hover:bg-slate-100">Kirish</a>
                <a th:href="@{/auth/signup}" class="block w-full text-center px-4 py-3 rounded-xl text-base font-bold text-white bg-brand-600 hover:bg-brand-700">Ro'yxatdan o'tish</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="flex items-center justify-between bg-slate-50 p-3 rounded-xl">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center">
                        <i data-lucide="user" class="w-5 h-5 text-brand-700"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-slate-800" th:text="${currentFullUsername}">User</p>
                        <a th:href="@{/profile}" class="text-xs text-brand-600 font-semibold">Shaxsiy kabinet</a>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="p-2 text-red-500 rounded-xl hover:bg-red-50 transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<footer th:fragment="footer" class="bg-dark-900 text-slate-400 py-12 mt-auto border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="space-y-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-brand-600 p-2 rounded-lg">
                        <i data-lucide="layout-grid" class="w-5 h-5 text-white"></i>
                    </div>
                    <span class="text-xl font-bold text-white tracking-tight">ManaPolya</span>
                </div>
                <p class="text-sm text-slate-400 max-w-xs">Sport maydonchalarini real vaqt rejimida qidirish, qulay band qilish va stadionlarni boshqarish tizimi.</p>
            </div>
            <div>
                <h3 class="text-white font-bold text-xs uppercase tracking-wider mb-4">Platforma</h3>
                <ul class="space-y-2 text-sm">
                    <li><a th:href="@{/}" class="hover:text-brand-500 transition-colors">Barcha maydonlar</a></li>
                    <li><a th:href="@{/auth/login}" class="hover:text-brand-500 transition-colors">Tizimga kirish</a></li>
                    <li><a th:href="@{/auth/signup}" class="hover:text-brand-500 transition-colors">Sherik/Ega sifatida ro'yxatdan o'tish</a></li>
                </ul>
            </div>
            <div>
                <h3 class="text-white font-bold text-xs uppercase tracking-wider mb-4">Texnik Yordam</h3>
                <p class="text-sm text-slate-400 mb-2">Muammo yoki savollar tugʻilsa, aloqaga chiqing:</p>
                <div class="flex items-center space-x-2 text-brand-500 font-bold">
                    <i data-lucide="phone" class="w-4 h-4"></i>
                    <span>+998 (90) 123-4567</span>
                </div>
            </div>
        </div>
        <div class="mt-12 pt-8 border-t border-slate-800 text-center text-xs text-slate-500">
            &copy; 2026 ManaPolya. Final Exam & Portfolio Project. Barcha huquqlar himoyalangan.
        </div>
    </div>
    <script>
        // Lucide ikonkalarni render qilish mantiqi
        document.addEventListener("DOMContentLoaded", function() {
            lucide.createIcons();
        });
    </script>
</footer>

</body>
</html>-->
