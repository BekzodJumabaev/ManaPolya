<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="header-assets">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManaPolya - Sport Maydonlari</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7f6; /* Ochiq va toza fon */
        }

        /* Haqiqiy yashil maysa rangi (Sportiv) */
        .bg-sport-green {
            background-color: #28a745 !important;
        }

        .navbar-brand {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .nav-link {
            font-weight: 500;
            font-size: 1.05rem;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            opacity: 0.8;
        }

        /* Chiroyli va sportiv tugmalar */
        .btn-white-sport {
            background-color: #ffffff;
            color: #28a745;
            font-weight: 700;
            border-radius: 8px;
            padding: 8px 22px;
            transition: all 0.2s;
            border: none;
        }
        .btn-white-sport:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
            color: #218838;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-sport-green shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand text-white d-flex align-items-center gap-2" href="/">
                ⚽ ManaPolya
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ps-lg-4">
                    <li class="nav-item">
                        <a class="nav-link text-white px-3" href="/">Maydonlar</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-white px-3" href="/fields/create">
                            <i class="bi bi-plus-circle me-1"></i> Maydon qo'shish
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">

                    <th:block sec:authorize="isAnonymous()">
                        <a href="/auth/login" class="text-white text-decoration-none fw-bold px-2">Kirish</a>
                        <a href="/auth/signup" class="btn btn-white-sport shadow-sm">Ro'yxatdan o'tish</a>
                    </th:block>

                    <th:block sec:authorize="isAuthenticated()">
                        <div class="dropdown">
                            <button class="btn btn-light rounded-pill dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 shadow-sm border-0" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle text-success fs-5"></i>

                                <span th:text="${currentFullUsername != null ? currentFullUsername : #authentication.name}" class="fw-bold text-dark pe-1">
                    Foydalanuvchi
                </span>
                            </button>

                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2 rounded-3 p-2" aria-labelledby="userMenu">
                                <li>
                                    <a class="dropdown-item py-2 rounded d-flex align-items-center gap-2" href="/profile/dashboard">
                                        <i class="bi bi-person-vcard text-secondary"></i> Kabinet
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider my-2"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                        <button type="submit" class="dropdown-item py-2 rounded text-danger d-flex align-items-center gap-2 fw-bold">
                                            <i class="bi bi-box-arrow-right"></i> Chiqish
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </th:block>

                </div>
            </div>
        </div>
    </nav>
</div>

<div th:fragment="footer-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                let alerts = document.querySelectorAll('.alert');
                alerts.forEach(function (alertNode) {
                    let alert = new bootstrap.Alert(alertNode);
                    alert.close(); // 4 soniyadan so'ng ekrandan yo'qoladi
                });
            }, 4000);
        });
    </script>
</div>

</body>
</html>
