<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="|${field.name} - Batafsil|">Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .details-img { height: 450px; object-fit: cover; border-radius: 20px; }
        .feature-icon { font-size: 1.6rem; color: #198754; }
        .booking-card { border: none; border-radius: 20px; }
        .sticky-top-offset { top: 2rem; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-arrow-left-circle me-2"></i>Asosiy sahifaga qaytish
        </a>
    </div>
</nav>

<div class="container pb-5">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${message}">Muvaffaqiyatli xabar</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">Xatolik xabari</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card booking-card shadow-sm overflow-hidden mb-4">
                <img th:if="${not #lists.isEmpty(field.images)}" th:src="${field.images[0].url}" class="w-100 details-img" alt="Field Image">
                <img th:if="${#lists.isEmpty(field.images)}" src="https://via.placeholder.com/800x450?text=Rasm+Mavjud+Emas" class="w-100 details-img" alt="No Image">

                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold mb-0" th:text="${field.name}">Maydon nomi</h2>
                        <span class="badge bg-success px-3 py-2" th:text="${field.fieldType}">FOOTBALL</span>
                    </div>
                    <p class="text-muted mb-4"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="|${field.regionName}, ${field.districtName}, ${field.address}|">Manzil</span></p>

                    <h5 class="fw-bold border-bottom pb-2 mb-3">Tavsif</h5>
                    <p class="text-secondary" style="line-height: 1.8;" th:text="${field.description}">Bu yerda maydon haqida to'liq ma'lumot bo'ladi.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-6 col-md-3 text-center">
                    <div class="card booking-card shadow-sm p-3 bg-white">
                        <i th:class="${field.hasShower} ? 'bi bi-droplet-fill feature-icon' : 'bi bi-droplet feature-icon text-muted'"></i>
                        <p class="small fw-bold mt-2 mb-0" th:text="${field.hasShower} ? 'Dush bor' : 'Dush yo\'q'"></p>
                    </div>
                </div>
                <div class="col-6 col-md-3 text-center">
                    <div class="card booking-card shadow-sm p-3 bg-white">
                        <i th:class="${field.hasLight} ? 'bi bi-lightbulb-fill feature-icon' : 'bi bi-lightbulb feature-icon text-muted'"></i>
                        <p class="small fw-bold mt-2 mb-0" th:text="${field.hasLight} ? 'Yoritish bor' : 'Yoritish yo\'q'"></p>
                    </div>
                </div>
                <div class="col-6 col-md-3 text-center">
                    <div class="card booking-card shadow-sm p-3 bg-white">
                        <i class="bi bi-clock-history feature-icon text-primary"></i>
                        <p class="small fw-bold mt-2 mb-0" th:text="|${field.openTime} - ${field.closeTime}|">Ish vaqti</p>
                    </div>
                </div>
                <div class="col-6 col-md-3 text-center">
                    <div class="card booking-card shadow-sm p-3 bg-white">
                        <i class="bi bi-star-fill feature-icon text-warning"></i>
                        <p class="small fw-bold mt-2 mb-0" th:text="${field.avarageRating}">Rating</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card booking-card shadow-sm p-4 sticky-top sticky-top-offset">
                <h4 class="fw-bold text-success mb-4 text-center">Hozir bron qiling</h4>

                <div class="text-center mb-4 bg-light rounded-3 p-3">
                    <p class="text-muted small mb-1">Soatbay narxi:</p>
                    <h3 class="fw-bold text-dark mb-0" th:text="|${field.priceHour} so'm|">Narx</h3>
                </div>

                <form th:action="@{|/fields/${field.id}/book|}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Boshlanish vaqti</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-plus"></i></span>
                            <input type="datetime-local" name="startTime" class="form-control border-start-0" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Tugash vaqti</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-check"></i></span>
                            <input type="datetime-local" name="endTime" class="form-control border-start-0" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm rounded-3">
                        <i class="bi bi-lightning-fill me-2"></i>Bron qilishni tasdiqlash
                    </button>

                    <p class="text-center text-muted small mt-3 px-2">
                        * Tanlangan vaqt oraliqlari 1 soatdan kam bo'lmasligi kerak.
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
