<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ManaPolya - Asosiy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-trophy-fill me-2"></i>ManaPolya</a>
        <div class="d-flex align-items-center">
            <span sec:authorize="isAuthenticated()" class="text-white me-3">
                Salom, <span sec:authentication="name">User</span>!
            </span>
            <a sec:authorize="!isAuthenticated()" href="/auth/login" class="btn btn-outline-light btn-sm">Kirish</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger btn-sm">Chiqish</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-4 justify-content-center">
        <div class="col-md-8">
            <form th:action="@{/}" method="get" class="input-group shadow-sm">
                <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Maydon qidirish...">
                <button type="submit" class="btn btn-success">Qidirish</button>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="field : ${fields}" th:if="${field != null}" class="col">
            <div class="card h-100 shadow-sm border-0">
                <img th:if="${not #lists.isEmpty(field.images)}" th:src="${field.images[0].url}" class="card-img-top" style="height: 200px; object-fit: cover;">
                <img th:if="${#lists.isEmpty(field.images)}" src="https://via.placeholder.com/400x250?text=No+Image" class="card-img-top" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${field.name}">Nomi</h5>
                    <p class="text-muted small"><i class="bi bi-geo-alt-fill text-danger"></i> <span th:text="|${field.regionName}, ${field.districtName}|">Manzil</span></p>
                    <p class="h5 text-success fw-bold" th:text="|${field.priceHour} so'm/soat|">Narx</p>
                    <a th:href="@{|/fields/${field.id}|}" class="btn btn-outline-success w-100 mt-2">Batafsil ko'rish</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
