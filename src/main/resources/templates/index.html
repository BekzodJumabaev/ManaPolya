<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ManaPolya - Asosiy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body { background-color: #f4f7f6; }
        .hudud-btn {
            background-color: #198754 !important;
            color: white !important;
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 18px;
            border: none;
            transition: all 0.2s;
        }
        .hudud-btn:hover {
            background-color: #146c43 !important;
        }
        .hudud-dropdown-menu {
            width: 280px;
            max-height: 380px;
            overflow-y: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border: 1px solid #e9ecef;
            padding: 8px;
        }
        .hudud-item {
            padding: 10px 12px;
            font-size: 0.95rem;
            color: #212529;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
        }
        .hudud-item:hover {
            background-color: #f8f9fa;
            color: #198754;
        }
        .hudud-header-btn {
            color: #198754;
            font-weight: bold;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        .card-custom {
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s;
            overflow: hidden;
        }
        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08) !important;
        }
        .search-box {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-5 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/"><i class="bi bi-trophy-fill me-2"></i>ManaPolya</a>

        <div class="d-flex align-items-center gap-3">
            <div class="dropdown">
                <button class="btn hudud-btn dropdown-toggle shadow-sm" type="button" id="hududDropdownBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                    <i class="bi bi-geo-alt-fill me-1"></i> <span th:text="${currentRegionName} ?: 'Butun O\'zbekiston'">Butun O'zbekiston</span>
                </button>
                <div class="dropdown-menu hudud-dropdown-menu" aria-labelledby="hududDropdownBtn" id="hududContainer">
                    <div class="hudud-item fw-bold text-success" onclick="selectLocation(null, null)">
                        <i class="bi bi-globe me-2"></i> Butun O'zbekiston
                    </div>
                    <hr class="my-1">

                    <div th:each="region : ${regions}"
                         class="hudud-item region-selector-item d-flex justify-content-between align-items-center"
                         th:data-id="${region.id}"
                         th:data-name="${region.regionName}">
                        <span th:text="${region.regionName}">Viloyat</span>
                        <i class="bi bi-chevron-right text-muted" style="font-size: 0.8rem;"></i>
                    </div>
                </div>
            </div>

            <span sec:authorize="isAuthenticated()" class="text-white small fw-bold px-2 py-1 bg-white bg-opacity-10 rounded">
                <i class="bi bi-person-circle me-1"></i> <span th:text="${currentFullUsername} ?: 'Foydalanuvchi'"></span>
            </span>

            <a sec:authorize="isAuthenticated()" href="/profile/dashboard" class="btn btn-sm btn-light text-success fw-bold ms-2 px-3 py-2 rounded-3 border-0 shadow-sm">
                <i class="bi bi-person-workspace me-1"></i> Kabinetim
            </a>

            <div sec:authorize="isAuthenticated()">
                <a href="/fields/create" class="btn btn-sm btn-light text-success fw-bold px-3 py-2 rounded-3 border-0 shadow-sm">
                    <i class="bi bi-plus-circle-fill me-1"></i> Maydon qo'shish
                </a>
            </div>

            <a sec:authorize="!isAuthenticated()" href="/auth/login" class="btn btn-outline-light btn-sm px-3 py-2 rounded-3 fw-bold">Kirish</a>

            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm px-3 py-2 rounded-3 fw-bold">Chiqish</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">

    <div class="row mb-5 justify-content-center">
        <div class="col-md-8">
            <form th:action="@{/}" method="get" class="input-group search-box">
                <input type="hidden" name="regionId" th:value="${selectedRegionId}">
                <input type="hidden" name="districtId" th:value="${selectedDistrictId}">
                <input type="text" name="search" th:value="${search}" class="form-control border-0 px-4 py-3" placeholder="Maydon qidirish yoki kalit so'z...">
                <button type="submit" class="btn btn-success fw-bold px-4"><i class="bi bi-search me-1"></i> Qidirish</button>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
        <div th:each="field : ${fields}" th:if="${field != null}" class="col">
            <div class="card h-100 card-custom shadow-sm">

                <div class="position-relative">
                    <img th:if="${field.images != null and not #lists.isEmpty(field.images) and field.images[0] != null}"
                         th:src="${field.images[0].url}"
                         class="card-img-top"
                         style="height: 220px; object-fit: cover;"
                         alt="Stadion rasmi">

                    <img th:if="${field.images == null or #lists.isEmpty(field.images) or field.images[0] == null}"
                         src="https://via.placeholder.com/400x220?text=Rasm+Mavjud+Emas"
                         class="card-img-top"
                         style="height: 220px; object-fit: cover;"
                         alt="Rasm mavjud emas">

                    <span class="badge bg-success position-absolute top-0 start-0 m-3 shadow-sm px-3 py-2 rounded-2 small" th:text="${field.fieldType}">Tur</span>

                    <span class="badge bg-white text-dark position-absolute top-0 end-0 m-3 shadow-sm px-2 py-2 rounded-2 d-flex align-items-center gap-1fw-bold">
        <i class="bi bi-star-fill text-warning"></i>
        <span th:text="${field.avarageRating ?: '0.0'}">0.0</span>
        <span class="text-muted fw-normal" style="font-size: 0.75rem;" th:text="|(${field.ratingCount ?: 0})|">(0)</span>
    </span>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="card-title fw-bold text-dark mb-2" th:text="${field.name}">Nomi</h5>
                    <p class="text-muted small mb-3"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="|${field.regionName}, ${field.districtName}|">Manzil</span></p>

                    <div class="mt-auto pt-3 border-top border-light">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small d-block">Ijara narxi:</span>
                                <span class="h5 text-success fw-bold m-0" th:text="${#numbers.formatDecimal(field.priceHour, 0, 'WHITESPACE', 0, 'POINT')} + ' so\'m'"></span>
                                <small class="text-secondary">/soat</small>
                            </div>
                            <a th:href="@{|/fields/${field.id}|}" class="btn btn-success fw-bold rounded-3 px-3 btn-sm">Batafsil <i class="bi bi-arrow-right small ms-1"></i></a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="row mt-5" th:if="${totalPages > 1}">
        <div class="col-12 d-flex justify-content-center">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-md shadow-sm rounded-3 overflow-hidden">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link text-success border-light" th:href="@{/(page=${currentPage - 1}, search=${search}, regionId=${selectedRegionId}, districtId=${selectedDistrictId})}"><i class="bi bi-chevron-left"></i></a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link border-light" th:classappend="${currentPage == i} ? 'bg-success border-success text-white' : 'text-success bg-white'"
                           th:href="@{/(page=${i}, search=${search}, regionId=${selectedRegionId}, districtId=${selectedDistrictId})}" th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link text-success border-light" th:href="@{/(page=${currentPage + 1}, search=${search}, regionId=${selectedRegionId}, districtId=${selectedDistrictId})}"><i class="bi bi-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    const currentSearch = /*[[${search}]]*/ '';
    const hududContainer = document.getElementById('hududContainer');

    document.addEventListener('click', function(e) {
        const item = e.target.closest('.region-selector-item');
        if (item) {
            const regionId = item.getAttribute('data-id');
            const regionName = item.getAttribute('data-name');
            loadDistrictsMenu(regionId, regionName);
        }
    });

    function loadDistrictsMenu(regionId, regionName) {
        hududContainer.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-success"></div></div>';

        fetch('/auth/districts?regionId=' + regionId)
            .then(res => res.json())
            .then(districts => {
                let html = `
                    <div class="hudud-header-btn mb-1" onclick="resetToRegions()">
                        <i class="bi bi-arrow-left-short fs-5"></i> Orqaga
                    </div>
                    <div class="hudud-item fw-bold text-success" onclick="selectLocation(${regionId}, null)">
                        <i class="bi bi-geo-alt me-2"></i> Butun ${regionName}
                    </div>
                    <hr class="my-1">
                `;

                districts.forEach(dist => {
                    html += `
                        <div class="hudud-item" onclick="selectLocation(${regionId}, ${dist.id})">
                            ${dist.districtName}
                        </div>
                    `;
                });
                hududContainer.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                resetToRegions();
            });
    }

    function resetToRegions() {
        window.location.reload();
    }

    function selectLocation(regionId, districtId) {
        let url = '/?';
        if (currentSearch) {
            url += 'search=' + encodeURIComponent(currentSearch) + '&';
        }
        if (regionId) {
            url += 'regionId=' + regionId + '&';
        }
        if (districtId) {
            url += 'districtId=' + districtId + '&';
        }
        if (url.endsWith('&') || url.endsWith('?')) {
            url = url.slice(0, -1);
        }
        window.location.href = url;
    }
</script>
</body>
</html>
