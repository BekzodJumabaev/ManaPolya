<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: header-assets}"></th:block>
    <title>Tizimga kirish - ManaPolya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image:
                    linear-gradient(135deg, rgba(16, 185, 129, 0.06) 0%, rgba(37, 99, 235, 0.04) 100%),
                    linear-gradient(to right, rgba(0,0,0,0.01) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(0,0,0,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sport-light-card {
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(51, 65, 85, 0.1);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
        }

        .brand-header { text-align: center; margin-bottom: 28px; }

        .brand-logo {
            display: inline-flex; align-items: center; gap: 10px;
            font-size: 1.6rem; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 40px; height: 40px; border-radius: 12px; background: #10b981;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: white; box-shadow: 0 8px 16px rgba(16, 185, 129, 0.15);
        }

        .form-label {
            font-size: 0.8rem; font-weight: 700; color: #475569;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }

        .input-group-sport {
            display: flex; align-items: center; background: #ffffff !important;
            border: 1px solid #cbd5e1; border-radius: 14px; transition: all 0.2s ease;
        }

        .input-group-sport:focus-within {
            border-color: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .input-icon { padding-left: 16px; color: #94a3b8; display: flex; align-items: center; }

        .custom-input {
            width: 100%; background: #ffffff !important; border: none;
            color: #0f172a !important; padding: 14px 14px 14px 12px;
            font-size: 0.95rem; outline: none; border-radius: 14px;
        }

        input:-webkit-autofill, input:-webkit-autofill:hover,
        input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #0f172a !important;
        }

        /* 🟢 IDE'da qizarmaydigan qilib tozalandi */
        .custom-input::-ms-reveal, .custom-input::-ms-clear { display: none !important; }
        input[type="password"]::-webkit-password-reveal-button,
        input[type="password"]::-webkit-password-toggle-button { display: none !important; }

        .eye-toggle {
            padding-right: 16px; color: #94a3b8; cursor: pointer;
            transition: color 0.2s; display: flex; align-items: center;
            background: #ffffff; border-radius: 0 14px 14px 0;
        }
        .eye-toggle:hover { color: #475569; }

        .btn-sport-submit {
            background: #10b981; border: none; color: white; font-weight: 700;
            font-size: 0.95rem; padding: 14px; border-radius: 14px; margin-top: 16px;
            transition: all 0.2s; width: 100%; display: flex; align-items: center;
            justify-content: center; gap: 8px;
        }
        .btn-sport-submit:hover { background: #059669; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2); }

        .custom-alert {
            background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b;
            border-radius: 14px; font-size: 0.85rem; font-weight: 600;
            padding: 12px 16px; display: flex; align-items: center; gap: 10px;
        }

        .action-link { color: #2563eb; text-decoration: none; font-weight: 700; transition: color 0.2s; }
        .action-link:hover { color: #1d4ed8; text-decoration: underline; }
    </style>
</head>
<body>

<div class="sport-light-card">
    <div class="brand-header">
        <div class="brand-logo">
            <div class="brand-icon"><i class="bi bi-dribbble"></i></div>
            ManaPolya
        </div>
        <p class="text-muted small m-0 mt-2 fw-medium">Sport maydonlarini onlayn band qilish</p>
    </div>

    <div th:if="${param.error}" class="custom-alert mb-4">
        <i class="bi bi-exclamation-circle-fill text-danger fs-5"></i>
        <div>Username yoki parol noto'g'ri kiritildi!</div>
    </div>

    <div th:if="${param.logout}" class="custom-alert mb-4" style="background: #d1fae5; border-color: #a7f3d0; color: #065f46;">
        <i class="bi bi-check-circle-fill text-success fs-5"></i>
        <div>Tizimdan muvaffaqiyatli chiqdingiz.</div>
    </div>

    <div th:if="${message}" class="custom-alert mb-4" style="background: #d1fae5; border-color: #a7f3d0; color: #065f46;">
        <i class="bi bi-check-circle-fill text-success fs-5"></i>
        <div th:text="${message}"></div>
    </div>

    <form th:action="@{/auth/login}" method="post">

        <input type="hidden" name="redirect" th:if="${param.redirect}" th:value="${param.redirect}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-person"></i></div>
                <input type="text" name="username" class="custom-input" placeholder="Foydalanuvchi nomi" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label m-0">Parol</label>
                <a href="/auth/reset-password" class="action-link" style="font-size: 0.78rem;">Parolni unutdingizmi?</a>
            </div>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-lock"></i></div>
                <input type="password" name="password" id="passwordField" class="custom-input" placeholder="Parolni kiriting" required>
                <div class="eye-toggle" id="eyeToggler"><i class="bi bi-eye" id="eyeIcon"></i></div>
            </div>
        </div>

        <button type="submit" class="btn btn-sport-submit">
            Tizimga kirish <i class="bi bi-chevron-right" style="font-size: 0.8rem;"></i>
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="font-size: 0.85rem; color: #64748b;">
        Yangi foydalanuvchimisiz?
        <a th:href="@{/auth/signup(redirect=${param.redirect})}" class="action-link ms-1">Ro'yxatdan o'tish</a>
    </div>
</div>

<script>
    document.getElementById('eyeToggler').addEventListener('click', function() {
        const passwordField = document.getElementById('passwordField');
        const eyeIcon = document.getElementById('eyeIcon');

        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        } else {
            passwordField.type = 'password';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        const alerts = document.querySelectorAll('.custom-alert');
        alerts.forEach(function(alert) {
            setTimeout(function() {
                alert.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                alert.style.opacity = '0';
                alert.style.transform = 'translateY(-10px)';
                setTimeout(function() { alert.remove(); }, 500);
            }, 3000);
        });
    });
</script>
</body>
</html>
