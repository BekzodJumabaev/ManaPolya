<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments :: header_links}" style="display:none;"></div>
    <title>Tizimga kirish | ManaPolya</title>
    <style>
        .card-login-premium {
            border-radius: 24px;
            border: none;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
        }
        .premium-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .premium-input-field {
            border-radius: 12px !important;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            font-weight: 500;
            color: #1e293b;
            transition: all 0.2s ease;
        }
        .premium-input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.12);
        }
    </style>
</head>
<body class="d-flex align-items-center py-5" style="min-height: 100vh; background-color: #f8fafc;">

<div th:replace="~{fragments :: navbar}"></div>

<div class="container my-auto">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4 animate__animated animate__zoomIn">
            <div class="card card-login-premium p-4 p-md-5 bg-white">

                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3 animate__animated animate__bounceIn" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h2 class="fw-black text-dark m-0" style="letter-spacing: -1px;">Xush kelibsiz</h2>
                    <p class="text-muted small mt-1">Davom etish uchun profilingizga kiring</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center rounded-3 border-0 border-start border-danger border-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2 text-danger fs-5"></i>
                    <div class="fw-semibold small text-danger">Username yoki parol xato kiritildi!</div>
                </div>
                <form th:action="@{/auth/login}" method="post">

                    <div class="mb-3">
                        <label class="form-label premium-label">Username (Login)</label>
                        <input type="text" name="username" class="form-control premium-input-field" placeholder="Username kiriting" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label premium-label">Parol</label>
                        <input type="password" name="password" class="form-control premium-input-field" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-premium-action btn-register-custom btn-lg w-100 py-3 rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Tizimga kirish
                    </button>
                </form>

                <p class="mt-4 text-center text-muted small m-0">
                    Yangi foydalanuvchimisiz? <a href="/auth/signup" class="text-success fw-bold text-decoration-none border-bottom border-success border-opacity-25 pb-0.5">Ro'yxatdan o'tish</a>
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer_scripts}"></div>

</body>
</html>
