<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card shadow p-4">
            <h2 class="text-center">Tizimga kirish</h2>

            <div th:if="${param.error}" class="alert alert-danger">
                Username yoki parol xato!
            </div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Parol</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Kirish</button>
            </form>
            <p class="mt-3 text-center">Yangi foydalanuvchimisiz? <a href="/auth/signup">Ro'yxatdan o'tish</a></p>
        </div>
    </div>
</div>
</body>
</html>
