<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ro'yxatdan o'tish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow p-4">
            <h2 class="text-center">Ro'yxatdan o'tish</h2>
            <form th:action="@{/auth/signup}" th:method="post" th:object="${userDto}">
                <div class="mb-3">
                    <label class="form-label">FIO</label>
                    <input type="text" th:field="*{fullname}" class="form-control">
                    <p class="text-danger" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" th:field="*{username}" class="form-control">
                    <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefon (+998XXXXXXXXX)</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Parol</label>
                    <input type="password" th:field="*{password}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Parolni tasdiqlash</label>
                    <input type="password" th:field="*{rePassword}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select th:field="*{role}" class="form-select">
                        <option value="USER">User (Mijoz)</option>
                        <option value="OWNER">Owner (Maydon egasi)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ro'yxatdan o'tish</button>
            </form>
            <p class="mt-3 text-center">Akkauntingiz bormi? <a href="/auth/login">Kirish</a></p>
        </div>
    </div>
</div>
</body>
</html>
