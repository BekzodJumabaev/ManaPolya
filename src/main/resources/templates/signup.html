<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: header-assets}"></th:block>
    <title>Ro'yxatdan o'tish | ManaPolya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9; color: #0f172a; font-family: 'Plus Jakarta Sans', sans-serif;
            background-image:
                    linear-gradient(135deg, rgba(16, 185, 129, 0.06) 0%, rgba(37, 99, 235, 0.04) 100%),
                    linear-gradient(to right, rgba(0,0,0,0.01) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(0,0,0,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .sport-light-card {
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 24px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 40px -15px rgba(51, 65, 85, 0.1);
            padding: 40px 36px; width: 100%; max-width: 500px;
        }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 1.6rem; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .brand-icon { width: 40px; height: 40px; border-radius: 12px; background: #10b981; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: white; box-shadow: 0 8px 16px rgba(16, 185, 129, 0.15); }

        .form-label { font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

        .input-group-sport { display: flex; align-items: center; background: #ffffff !important; border: 1px solid #cbd5e1; border-radius: 14px; transition: all 0.2s ease; }
        .input-group-sport:focus-within { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12); }

        .input-icon { padding-left: 16px; color: #94a3b8; display: flex; align-items: center; }

        .custom-input { width: 100%; background: #ffffff !important; border: none; color: #0f172a !important; padding: 12px 14px 12px 12px; font-size: 0.95rem; outline: none; border-radius: 14px; }

        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important; -webkit-text-fill-color: #0f172a !important;
        }

        /* 🟢 IDE'da qizarmaydigan qilib tozalandi */
        .custom-input::-ms-reveal, .custom-input::-ms-clear { display: none !important; }
        input[type="password"]::-webkit-password-reveal-button { display: none !important; }

        .eye-toggle { padding-right: 16px; color: #94a3b8; cursor: pointer; transition: color 0.2s; display: flex; align-items: center; background: #ffffff; border-radius: 0 14px 14px 0; }
        .eye-toggle:hover { color: #475569; }

        .btn-sport-submit {
            background: #10b981; border: none; color: white; font-weight: 700; font-size: 0.95rem; padding: 14px; border-radius: 14px; margin-top: 10px; transition: all 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-sport-submit:hover { background: #059669; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="py-5">

<div class="sport-light-card my-5">
    <div class="brand-header">
        <div class="brand-logo">
            <div class="brand-icon"><i class="bi bi-dribbble"></i></div>
            ManaPolya
        </div>
        <p class="text-muted small m-0 mt-2 fw-medium">Yangi hisob qaydnomasini yaratish</p>
    </div>

    <form th:action="@{/auth/signup}" th:method="post" th:object="${userDto}" autocomplete="off">

        <input type="hidden" name="redirect" th:if="${param.redirect}" th:value="${param.redirect}">

        <div class="mb-3">
            <label class="form-label">To'liq FIO (Ism va Familiya)</label>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-person-badge"></i></div>
                <input type="text" th:field="*{fullname}" class="custom-input" placeholder="Masalan: Bekzod Jumabaev" required>
            </div>
            <p class="text-danger small mt-1 fw-medium mb-0" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label">Username (Tizim uchun login)</label>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-person"></i></div>
                <input type="text" th:field="*{username}" class="custom-input" placeholder="Masalan: bekzod_dev" required>
            </div>
            <p class="text-danger small mt-1 fw-medium mb-0" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefon raqam</label>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-telephone"></i></div>
                <input type="text" th:field="*{phoneNumber}" class="custom-input" placeholder="Masalan: +998901234567" required>
            </div>
            <p class="text-danger small mt-1 fw-medium mb-0" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label">Parol (Kamida 6 ta belgi)</label>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-lock"></i></div>
                <input type="password" th:field="*{password}" id="passField" class="custom-input" placeholder="••••••" required>
                <div class="eye-toggle" onclick="togglePass('passField', 'eyeIcon1')"><i class="bi bi-eye" id="eyeIcon1"></i></div>
            </div>
            <p class="text-danger small mt-1 fw-medium mb-0" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="mb-4">
            <label class="form-label">Parolni takroran kiriting</label>
            <div class="input-group-sport">
                <div class="input-icon"><i class="bi bi-lock-fill"></i></div>
                <input type="password" th:field="*{rePassword}" id="rePassField" class="custom-input" placeholder="••••••" required>
                <div class="eye-toggle" onclick="togglePass('rePassField', 'eyeIcon2')"><i class="bi bi-eye" id="eyeIcon2"></i></div>
            </div>
            <p class="text-danger small mt-1 fw-medium mb-0" th:if="${#fields.hasErrors('rePassword')}" th:errors="*{rePassword}"></p>
        </div>

        <button type="submit" class="btn btn-sport-submit">
            <i class="bi bi-check-circle-fill me-1"></i> Ro'yxatdan o'tishni yakunlash
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="font-size: 0.85rem; color: #64748b;">
        Akkauntingiz bormi?
        <a th:href="@{/auth/login(redirect=${param.redirect})}" class="text-success fw-bold text-decoration-none ms-1">Tizimga kirish</a>
    </div>
</div>

<script>
    function togglePass(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>
</body>
</html>
