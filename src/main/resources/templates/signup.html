<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments :: header_links}"></div>
    <title>Ro'yxatdan o'tish | ManaPolya</title>
    <style>
        .card-signup-premium {
            border-radius: 24px;
            border: none;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
        }
        .premium-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .premium-input-field {
            border-radius: 12px !important;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            font-weight: 500;
            color: #1e293b;
            transition: all 0.2s ease;
        }
        .premium-input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.12);
        }
    </style>
</head>
<body class="d-flex align-items-center py-5" style="min-height: 100vh; background-color: #f8fafc;">

<div th:replace="~{fragments :: navbar}"></div>

<div class="container my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 animate__animated animate__zoomIn">
            <div class="card card-signup-premium p-4 p-md-5 bg-white">

                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3 animate__animated animate__bounceIn" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h2 class="fw-black text-dark m-0" style="letter-spacing: -1px;">Hisob yaratish</h2>
                    <p class="text-muted small mt-1">Platformadan to'liq foydalanish uchun ma'lumotlarni kiriting</p>
                </div>

                <form th:action="@{/auth/signup}" th:method="post" th:object="${userDto}">

                    <div class="mb-3">
                        <label class="form-label premium-label">To'liq FIO (Ism va Familiya)</label>
                        <input type="text" th:field="*{fullname}" class="form-control premium-input-field" placeholder="Masalan: Bekzod Jumabaev" required>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label premium-label">Username (Tizim uchun login)</label>
                        <input type="text" th:field="*{username}" class="form-control premium-input-field" placeholder="Masalan: bekzod_dev" required>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label premium-label">Telefon raqam</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-control premium-input-field" placeholder="Masalan: +998901234567" required>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label premium-label">Parol (Kamida 6 ta belgi)</label>
                        <input type="password" th:field="*{password}" class="form-control premium-input-field" placeholder="******" required>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label premium-label">Parolni takroran kiriting</label>
                        <input type="password" th:field="*{rePassword}" class="form-control premium-input-field" placeholder="******" required>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('rePassword')}" th:errors="*{rePassword}"></p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label premium-label">Siz saytdan qanday maqsadda foydalanasiz?</label>
                        <select th:field="*{role}" class="form-select premium-input-field" required>
                            <option value="CUSTOMER">Mijozman (Stadion bron qilaman)</option>
                            <option value="OWNER">Maydon egasiman (Biznesingizni boshqaring)</option>
                        </select>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
                    </div>

                    <button type="submit" class="btn btn-premium-action btn-register-custom btn-lg w-100 py-3 rounded-3 shadow-sm">
                        <i class="bi bi-check-circle-fill me-1"></i> Ro'yxatdan o'tishni yakunlash
                    </button>
                </form>

                <p class="mt-4 text-center text-muted small m-0">
                    Akkauntingiz bormi? <a href="/auth/login" class="text-success fw-bold text-decoration-none border-bottom border-success border-opacity-25 pb-0.5">Tizimga kirish</a>
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer_scripts}"></div>

</body>
</html>
