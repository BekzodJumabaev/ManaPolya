<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ro'yxatdan o'tish | ManaPolya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .card-signup { border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-signup p-4 p-md-5 bg-white">

                <h2 class="text-center fw-bold text-success mb-4">
                    <i class="bi bi-person-plus-fill me-2"></i>Ro'yxatdan o'tish
                </h2>

                <form th:action="@{/auth/signup}" th:method="post" th:object="${userDto}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">To'liq FIO (Ism va Familiya)</label>
                        <input type="text" th:field="*{fullname}" class="form-control form-control-lg rounded-3" placeholder="Masalan: Bekzod Jumabaev">
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Username (Tizim uchun login)</label>
                        <input type="text" th:field="*{username}" class="form-control form-control-lg rounded-3" placeholder="Masalan: bekzod_dev">
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Telefon raqam</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-control form-control-lg rounded-3" placeholder="Masalan: +998901234567">
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Parol (Kamida 6 ta belgi)</label>
                        <input type="password" th:field="*{password}" class="form-control form-control-lg rounded-3" placeholder="******">
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Parolni takroran kiriting</label>
                        <input type="password" th:field="*{rePassword}" class="form-control form-control-lg rounded-3" placeholder="******">
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('rePassword')}" th:errors="*{rePassword}"></p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Siz saytdan qanday maqsadda foydalanasiz?</label>
                        <select th:field="*{role}" class="form-select form-select-lg rounded-3" required>
                            <option value="CUSTOMER">Mijozman (Stadion bron qilaman)</option>
                            <option value="OWNER">Maydon egasiman (Biznesingizni boshqaring)</option>
                        </select>
                        <p class="text-danger small mt-1 fw-medium" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 rounded-3 fw-bold shadow-sm py-3">
                        <i class="bi bi-check-circle-fill me-1"></i> Ro'yxatdan o'tishni yakunlash
                    </button>
                </form>

                <p class="mt-4 text-center text-muted small">
                    Akkauntingiz bormi? <a href="/auth/login" class="text-success fw-bold text-decoration-none">Tizimga kirish</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
